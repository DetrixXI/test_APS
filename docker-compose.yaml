version: "3.8"

services:
  elasticsearch:
    image: elasticsearch:9.4.1
    container_name: 'elc'
    environment:
      node.name: elc
      cluster.name: clsr
      ES_JAVA_OPTS: -Xmx512m -Xms512m
      discovery.type: single-node
      xpack.security.enabled: false
      logger.org.elasticsearch: WARN
      logger.root: WARN
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s 
  api:
    build: .
    container_name: app
    ports: 
      - 8000:8000
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ES_URL: "elasticsearch:9200"
    command: ['sh', '-c', "alembic upgrade head && python3 fill_db_es.py && python3 app.py"]
    depends_on:
      elasticsearch: 
        condition: 'service_started'